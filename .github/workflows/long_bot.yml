name: long-bot
# Started on time by an external scheduler (cron-job.org) through the GitHub API.
# GitHub's own cron was dropped: on this repo it started runs 5-9 hours late, after the market had closed.
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: long-bot
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run long bot (live, paper account)
        env:
          APCA_API_KEY_ID: ${{ secrets.LONG_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.LONG_SECRET }}
        run: python alpaca_aggressive_bot.py --live 2>&1 | tee -a bot_logs/auto_run.log
      - name: Save logs and stake state
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add bot_logs
          git diff --cached --quiet || (git commit -m "long bot run $(date -u +%F)" && git pull --rebase && git push)
