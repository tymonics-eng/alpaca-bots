name: fast-bot-overnight
# Overnight QQQ strategy on the fast-bot account. Started on time by an external scheduler (cron-job.org)
# through the GitHub API with input mode=buy or mode=sell. The bot waits inside the job for the exact time
# (5 min before close / 1 min after open) using Alpaca's market clock, so DST, holidays and short days are handled.
on:
  workflow_dispatch:
    inputs:
      mode: { description: "buy or sell", required: true, default: "sell" }
permissions:
  contents: write
concurrency: fast-bot
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Pick mode
        id: m
        run: |
          case "${{ inputs.mode }}" in buy|sell) echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT;; *) echo "bad mode"; exit 1;; esac
      - name: Run overnight bot
        env:
          APCA_API_KEY_ID: ${{ secrets.FAST_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.FAST_SECRET }}
        run: python overnight_bot.py --mode ${{ steps.m.outputs.mode }}
      - name: Save logs
        if: always()
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add bot_logs_overnight || true
          git diff --cached --quiet || (git commit -m "overnight bot ${{ steps.m.outputs.mode }} $(date -u +%F)" && git pull --rebase && git push)
